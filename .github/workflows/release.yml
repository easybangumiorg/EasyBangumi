name: release
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3.5.2
        with:
          submodules: recursive
          token: ${{ secrets.TOKEN }}

      - name: Checkout Private
        uses: actions/checkout@v4
        with:
          repository: 'easybangumiorg/EasyBangumiPrivate'
          token: ${{ secrets.TOKEN }}
          path: 'private'
          ref: main

      - name: Setup Java JDK
        uses: actions/setup-java@v1.4.4
        with:
          java-version: 17

      # Gradle 缓存配置
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
        env:
          RELEASE: true

      - name: Validate DanDanPlay credentials
        run: |
          if [ -z "$DANDANPLAY_APP_ID" ] || [ -z "$DANDANPLAY_APP_SECRET" ]; then
            echo "::error::Missing DANDANPLAY_APP_ID or DANDANPLAY_APP_SECRET repository secret"
            exit 1
          fi
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}

      - name: Build
        run: |
          ls private
          cp ./private/google-services.json ./app/google-services.json
          ls app
          chmod +x ./gradlew
          ./gradlew :app:assembleNormalRelease :app:assembleCompatRelease
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          BUGLY_APPID: ${{ secrets.BUGLY_APPID }}
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
          RELEASE: true

      - name: Get Version
        id: getVersion
        run: |
          echo "JSON file content:"
          cat app/build/outputs/apk/normal/release/output-metadata.json
          echo "BANGUMI_VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/normal/release/output-metadata.json)" >> $GITHUB_ENV

      - name: Setup build tool version variable
        shell: bash
        run: |
          echo ${{ env.BANGUMI_VERSION }}
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: sign-normal-apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/normal/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PWD }}
          keyPassword: ${{ secrets.KEY_PWD }}
        env:
          # override default build-tools version (29.0.3) -- optional
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: sign-compat-apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/compat/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PWD }}
          keyPassword: ${{ secrets.KEY_PWD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: rename-apk
        run: |
          mv app/build/outputs/apk/normal/release/app-normal-release-unsigned-signed.apk easybangumi-${{ env.BANGUMI_VERSION }}.apk
          mv app/build/outputs/apk/compat/release/app-compat-release-unsigned-signed.apk easybangumi-${{ env.BANGUMI_VERSION }}-compat.apk

      - name: Archive apk
        uses: actions/upload-artifact@v4
        with:
          name: easybangumi-${{ env.BANGUMI_VERSION }}-apks
          path: |
            easybangumi-${{ env.BANGUMI_VERSION }}.apk
            easybangumi-${{ env.BANGUMI_VERSION }}-compat.apk
          compression-level: 0

      - name: Release
        run: |
          gh release create -d ${{ env.BANGUMI_VERSION }} easybangumi-${{ env.BANGUMI_VERSION }}.apk easybangumi-${{ env.BANGUMI_VERSION }}-compat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: push_mapping
        if: ${{ env.BANGUMI_VERSION }} != "" && ${{ env.BANGUMI_VERSION }} != "."
        run: |
          cd private
          mkdir -p ./mapping/${{ env.BANGUMI_VERSION }}/normal ./mapping/${{ env.BANGUMI_VERSION }}/compat
          mv -b --suffix=.old ../app/build/outputs/mapping/normalRelease/* ./mapping/${{ env.BANGUMI_VERSION }}/normal
          mv -b --suffix=.old ../app/build/outputs/mapping/compatRelease/* ./mapping/${{ env.BANGUMI_VERSION }}/compat
          # GitHub rejects regular Git objects larger than 100 MiB. Keep a safety margin and
          # gzip only oversized R8 mappings; retrace can consume the file after decompression.
          find ./mapping/${{ env.BANGUMI_VERSION }} -name mapping.txt -type f -size +90M -exec gzip -9 {} \;
          oversized_file=$(find ./mapping/${{ env.BANGUMI_VERSION }} -type f -size +95M -print -quit)
          if [ -n "$oversized_file" ]; then
            echo "::error::Private asset still exceeds the safe Git object limit: $oversized_file"
            exit 1
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- ./mapping/${{ env.BANGUMI_VERSION }}
          if git diff --cached --quiet; then
            echo "No new mapping assets to push"
          else
            git commit -m "[auto] mapping ${{ env.BANGUMI_VERSION }}"
            # actions/checkout has already configured the private repository's authenticated
            # origin. A normal fast-forward push avoids overwriting unrelated private assets.
            git push origin HEAD:main
          fi
